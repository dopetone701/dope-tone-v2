<!-- 🚨 FINAL FIX V3 - Kills beats#/#/beats loop -->
<script>
  (function(){
    try {
      var isLive = location.port === "5500" || location.hostname.includes("127.0.0.1");
      if(!isLive) return;

      var full = location.href;
      var pathname = location.pathname;
      var hash = location.hash || "";

      // If we are in bad state like /beats#/#/beats or /vault#/vault
      var isBad = pathname!== "/" && pathname!== "/index.html" &&!pathname.endsWith("/index.html");
      var hasDoubleHash = (full.match(/#/g) || []).length > 1;
      var hasWeird = full.includes("#/#/") || full.includes("beats#") || full.includes("vault#");

      if(isBad || hasDoubleHash || hasWeird){
        // Extract the REAL intended route = last #/something in URL
        var intended = "/";
        if(hash){
          // Get last segment after last #
          var parts = hash.split("#").filter(Boolean);
          var last = parts[parts.length - 1] || "/";
          if(!last.startsWith("/")) last = "/" + last;
          intended = last.split("?")[0].split("#")[0] || "/";
        } else {
          intended = pathname;
        }
        // Clean
        intended = intended.replace(/\/+/g, "/").replace(/\/+$/, "") || "/";
        if(!intended.startsWith("/")) intended = "/" + intended;

        var finalUrl = "/#" + intended.replace(/^\//, "");
        console.log("[V3 FIX] BAD URL:", full, "->", finalUrl);
        location.replace(finalUrl);
      }
    } catch(e){ console.log(e); }
  })();
</script>
