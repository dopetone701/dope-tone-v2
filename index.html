<!-- V13 FINAL - Kills beats#/#/beats loop + drawer blur fix -->
<script>
  (function(){
    try {
      var full = location.href;
      var hasDoubleHash = (full.match(/#/g) || []).length > 1;
      var hasWeird = full.includes("#/#/") || full.includes("beats#") || full.includes("vault#") || full.includes("cart#");

      if(hasDoubleHash || hasWeird){
        var hash = location.hash || "";
        var parts = hash.split("#").filter(Boolean);
        var last = parts[parts.length - 1] || "home";
        if(!last.startsWith("/")) last = "/" + last;
        last = last.split("?")[0].split("#")[0] || "/home";
        last = last.replace(/\/+/g, "/").replace(/\/+$/, "") || "/home";
        var finalUrl = "/#" + last.replace(/^\//, "");
        console.log("[V13 FIX] BAD URL:", full, "->", finalUrl);
        location.replace(finalUrl);
      }
      if(!location.hash || location.hash === "#"){
        history.replaceState(null, "", "#/home");
      }
    } catch(e){}
  })();
</script>

<script>
// V14 - KEEP MUSIC ALIVE ON LOCK / BG
(function(){
  let wakeLock = null;
  async function lockScreenKeepAlive(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ console.log('wakeLock released'); });
      }
    }catch{}
    try{
      if('mediaSession' in navigator){
        navigator.mediaSession.playbackState = 'playing';
      }
    }catch{}
  }
  document.addEventListener('click', ()=>{ lockScreenKeepAlive(); }, {once:true});
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && window.__DT_AUDIO__ && window.__SHOULD_PLAY__){
      setTimeout(()=> window.__DT_AUDIO__.play().catch(()=>{}), 150);
      lockScreenKeepAlive();
    }
  });
})();
</script>
